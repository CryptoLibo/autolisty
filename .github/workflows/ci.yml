name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores ficticios: solo para que los módulos carguen durante el build.
      OPENAI_API_KEY: ci-placeholder
      AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
      AUTOMATION_DB_PATH: ${{ github.workspace }}/.ci/automation.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p .ci
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Agente local (sintaxis)
        run: node --check local-agent/agent.mjs && node scripts/check-agent.mjs
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
